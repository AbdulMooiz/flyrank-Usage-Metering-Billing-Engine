services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: usage_metering
      POSTGRES_USER: usage
      POSTGRES_PASSWORD: usage
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U usage -d usage_metering"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://usage:usage@db:5432/usage_metering}
      TEST_DATABASE_URL: ${TEST_DATABASE_URL:-postgresql+psycopg://usage:usage@db:5432/usage_metering_test}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-sk_test_replace_me}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-whsec_replace_me}
      STRIPE_PRO_PRICE_ID: ${STRIPE_PRO_PRICE_ID:-price_replace_me}
      STRIPE_SUCCESS_URL: ${STRIPE_SUCCESS_URL:-http://localhost:8000/health?checkout=success&session_id={CHECKOUT_SESSION_ID}}
      STRIPE_CANCEL_URL: ${STRIPE_CANCEL_URL:-http://localhost:8000/health?checkout=cancel}
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    command: ["sh", "-c", "alembic upgrade head && python -m app.seed && uvicorn app.main:app --host 0.0.0.0 --port 8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  worker:
    build: .
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://usage:usage@db:5432/usage_metering}
      RECONCILIATION_INTERVAL_SECONDS: ${RECONCILIATION_INTERVAL_SECONDS:-300}
    depends_on:
      api:
        condition: service_healthy
    command: ["python", "-m", "app.jobs.reconcile"]
    restart: unless-stopped

volumes:
  postgres_data:
